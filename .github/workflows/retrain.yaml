name: Automatic Model Retraining

on:
  repository_dispatch:
    types: [data-drift-detected] # Listens for the webhook from step 2

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pull Data (DVC)
        run: dvc pull

      - name: Run Pipeline
        run: |
          python src/preprocessing.py
          python src/train.py

      - name: Commit New Model
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/return_model.pkl data/model_metrics.json data/shap_importance.json
          git commit -m "Auto-update model via drift trigger" || echo "No changes"
          git push